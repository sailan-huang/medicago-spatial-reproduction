name: reproduction-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --frozen

      - name: Install report builder
        run: npm ci

      - name: Lint
        run: uvx ruff check analysis scripts tests

      - name: Download and verify public inputs
        run: uv run python scripts/download_data.py

      - name: Run input and mapping tests
        run: uv run pytest -q

      - name: Rebuild complete analysis and report
        run: |
          uv run python -m analysis.reproduction
          uv run python scripts/build_report.py
          uv run python scripts/render_pdf_previews.py
          node scripts/build_docx_report.js
          uv run python scripts/validate_docx_report.py
          uv run python scripts/validate_results.py

