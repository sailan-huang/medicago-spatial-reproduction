[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medicago-spatial-reproduction"
version = "0.1.0"
description = "Reproducible single-section reanalysis of a Medicago root-nodule spatial transcriptomics dataset"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sailan Huang" }]
dependencies = [
  "anndata==0.13.4",
  "h5py==3.16.0",
  "igraph==1.0.0",
  "ipykernel==7.4.0",
  "jupyter==1.1.1",
  "jupytext==1.19.7",
  "leidenalg==0.12.0",
  "matplotlib==3.11.2",
  "nbconvert==7.17.2",
  "numpy==2.5.5",
  "openpyxl==3.1.5",
  "pandas==3.1.1",
  "pyyaml==6.0.4",
  "pytest==9.2.0",
  "scanpy==1.12.6",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "seaborn==0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["analysis"]

